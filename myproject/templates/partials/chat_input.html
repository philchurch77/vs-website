{# Shared chat input area. Vars: send_class (optional extra button classes) #}
<div class="input-area">
    <textarea id="messageInput" rows="1" placeholder="Type here..."></textarea>
    <button id="sendBtn" type="button" class="{{ send_class|default:'' }}" onclick="sendMessage()">Send</button>
</div>
<p class="chat-privacy-note">Please don't include pupil names or any details that could identify a child.</p>
