{# Shared chat page header: heading + subtitle + history-drawer hamburger.
   Vars: heading, subtitle, drawer_id #}
<header class="panel-header">
    <div class="panel-heading">
        <h1>{{ heading }}</h1>
        <p class="panel-subtitle">{{ subtitle }}</p>
    </div>
    <button type="button"
            class="chat-history-hamburger"
            aria-controls="{{ drawer_id }}"
            aria-expanded="false">
        <span class="visually-hidden">Open chat history</span>
        <span class="chat-history-hamburger-icon" aria-hidden="true">
            <span class="chat-history-hamburger-line"></span>
            <span class="chat-history-hamburger-line"></span>
        </span>
    </button>
</header>
